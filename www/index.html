// NFC: vibra + beep (už máš – pre istotu finálna verzia)
function canVibrate () {
    return (typeof navigator !== 'undefined' && typeof navigator.vibrate === 'function');
}

function notifyNfcTagRead () {
    console.log('[NFC] TAG READ');

    try {
        if (canVibrate()) {
            navigator.vibrate(200);
        }
    } catch (e) {
        console.log('[NFC] vibrácia chyba', e);
    }

    try {
        var beep = document.getElementById('nfcBeep');
        if (beep && typeof beep.play === 'function') {
            beep.currentTime = 0;
            beep.play().catch(function(){});
        }
    } catch (e) {
        console.log('[NFC] beep chyba', e);
    }
}

function getBarcodeScannerPlugin() {
    const cap = (window.Capacitor && window.Capacitor.Plugins) || {};
    if (cap.BarcodeScanner) {
        return cap.BarcodeScanner;
    }

    // fallback: ak je k dispozícii pôvodný cordovský plugin
    if (window.cordova && window.cordova.plugins && window.cordova.plugins.barcodeScanner) {
        return {
            // zrýchlený wrapper, aby sme mali async/await
            async scan() {
                return new Promise(function (resolve, reject) {
                    window.cordova.plugins.barcodeScanner.scan(
                        function (res) {
                            // prevedieme na podobný tvar ako Capacitor
                            if (res && !res.cancelled) {
                                resolve({ barcodes: [{ rawValue: res.text }] });
                            } else {
                                resolve({ barcodes: [] });
                            }
                        },
                        function (err) {
                            reject(err);
                        }
                    );
                });
            },
            async requestPermissions() {
                // pôvodný cordovský plugin nemal requestPermissions -> tvárime sa že povolené
                return { camera: "granted" };
            }
        };
    }

    return null;
}

 async function prepareBarcodeScanner() {
    try {
        const BarcodeScanner = getBarcodeScannerPlugin();

        if (!BarcodeScanner) {
            console.log('[BARCODE] plugin nenájdený');
            return;
        }

        if (
            typeof BarcodeScanner.isGoogleBarcodeScannerModuleAvailable !== 'function'
        ) {
            console.log('[BARCODE] Google module API nie je dostupné');
            return;
        }

        const status =
            await BarcodeScanner.isGoogleBarcodeScannerModuleAvailable();

        console.log('[BARCODE] module available:', status.available);

        if (status.available) {
            return;
        }

        console.log('[BARCODE] spúšťam inštaláciu modulu');

        await BarcodeScanner.installGoogleBarcodeScannerModule();

        await BarcodeScanner.addListener(
            'googleBarcodeScannerModuleInstallProgress',
            function (event) {

                console.log(
                    '[BARCODE INSTALL]',
                    event.state,
                    event.progress
                );

                if (event.state === 4) {
                    console.log(
                        '[BARCODE] Google Barcode Scanner úspešne nainštalovaný'
                    );
                }

                if (event.state === 5) {
                    console.log(
                        '[BARCODE] Inštalácia zlyhala'
                    );
                }
            }
        );

    } catch (e) {
        console.log('[BARCODE] prepare error', e);
    }
}

                console.log('[NFC] Fake režim – ponechávam len idleNfcHandler');

                // Zrušíme všetky "skutočné" NFC handlery
                try { nfc.removeTagDiscoveredListener(overNfc, nfcwin, nfcfail); } catch(e){}

            function removeTags(str) {
                if ((str === null) || (str === ''))
                    return false;
                else
                    str = str.toString();
                return str.replace(/(<([^>]+)>)/ig, '');
            }

            // ignoreLock = true -> ignoruje lock + ZMAŽE ho (napr. pri logoute)
            function resetnfcfing(ignoreLock) {
                var now = Date.now();

                if (!ignoreLock && nfcLockUntil && now < nfcLockUntil) {
                    var seconds = Math.ceil((nfcLockUntil - now) / 1000);
                    alert('Senzory karty budú dostupné približne o ' + seconds + ' sekúnd.');
                    return;
                }

                // ak máme lock ignorovať, rovno ho zrušíme
                if (ignoreLock) {
                    nfcLockUntil = 0;
                }

                // vypneme všetko
                allStop();
                // zrušíme prípadný idle handler (fake režim)
                try { nfc.removeTagDiscoveredListener(idleNfcHandler, nfcwin, nfcfail); } catch(e){}

                // a po krátkej pauze znovu zapneme reálny overNfc
                setTimeout(function(){
                    try { nfc.addTagDiscoveredListener(overNfc, nfcwin, nfcfail); } catch(e){}
                    $('#overidentituON').show();
                    $('#overidentituOFF').hide();
                }, 500);
            }

            $("#overidentituON,#overidentituOFF").click(function() {
                resetnfcfing(false);
            });

            function allStop() {
                try { nfc.removeTagDiscoveredListener(overNfc, nfcwin, nfcfail); } catch(e){}
                $('#overidentituOFF').show();
                $('#overidentituON').hide();
            }

function saveNfc(nfcEvent) {
    // 🔒 Povolené len na obrazovke "Prideľ kartu"
    if (!isNfcAllowedForSave()) {
        console.log('[NFC] Tag ignorovaný – saveNfc mimo obrazovky Prideľ kartu', nfcEvent);
        return;
    }

    // sme v režime Prideľ kartu → vibra + pípnutie
    notifyNfcTagRead();

    var tag = nfcEvent.tag;
    var tagId = nfc.bytesToHexString(tag.id);
    $.ajax({
        type: "POST",
        url:  "https://dods.sk/app_load.php",
        data: { co: 'add_nfc', kto: $('#zampridelnfc').val(), kod: tagId },
        cache: false,
        dataType: "text",
        success: function(datax){
            if (datax=='ok') {
                alert('Karta bola úspešne zapísaná do databázy !');
            } else {
                alert('Kartu sa nepodarilo zapísať do databázy, skúste ešte raz !');
            }
            $('#zampridelnfc').find('option').remove();
            $('#submenu').text('');
            $('#showoffline').hide();
            $("#pridelnfc").show();
            $("#odobernfc").show();
            console.log('[NFC] Odobernfc visible is:', $("#odobernfc").is(":visible"));
            $('#showpridelnfc').hide();
            nfc.removeTagDiscoveredListener(saveNfc, nfcwin, nfcfail);
        },
        error: function(datax){
            alert("Chyba: pravdepodobne nie ste pripojení na internet");
            nfc.removeTagDiscoveredListener(saveNfc, nfcwin, nfcfail);
        }
    });
}


function overNfc(nfcEvent) {
    // 🔒 Povolené len na login obrazovke s textom "Priložte kartu"
    if (!isNfcAllowedForOver()) {
        console.log('[NFC] Tag ignorovaný – overNfc mimo povolenej obrazovky', nfcEvent);
        return;
    }

    var now = Date.now();
    if (nfcLockUntil && now < nfcLockUntil) {
        console.log('[NFC] Tag ignorovaný – v lock intervale', nfcEvent);
        return;
    }

    // nastaviť 2-minútový lock a pustiť fake NFC (idle handler)
    nfcLockUntil = now + 3000; // 3 sekundy
    //activateFakeNfcOnly();

    // sme na správnej obrazovke → vibra + pípnutie
    notifyNfcTagRead();

var tag = nfcEvent.tag;
var tagId;

if (typeof tag.id === 'string') {
    // iOS → už je to hotový HEX string
    tagId = tag.id.trim().toLowerCase();
    nfcDebugLog('🍏 USING STRING ID: ' + tagId);
} else {
    // Android → prevedieme bytes na hex
    tagId = nfc.bytesToHexString(tag.id);
    nfcDebugLog('🤖 USING BYTES ID: ' + tagId);
}
    if (unicards.indexOf(tagId)>=0) {
        zamestnanec=0;
        konto=0; // senecio
        $('#logged').text("Vitajte ADMIN");
        $('#showoffline').hide();
        $('#loggedbutton').hide();
        $('#managebutton').hide();
        $('#logout').show();
        //$('#zavri').show();
        allStop();
    } else {
        $.ajax({
            type: "POST",
            url:  "https://dods.sk/app_load.php",
            data: { co: 'over_nfc', kod: tagId },
            cache: false,
            dataType: "text",
            success: function(datax){
                if (datax=='fail') {
                    alert('Daná karta nepatrí nikomu v databáze.');
                    resetnfcfing(false);
                } else {
                    datax2=datax.split('|');
                    zamestnanec=datax2[0];
                    $('#logged').text("Vitajte "+datax2[1]);
                    $('#loggedbutton').hide();
                    $('#logout').show();
                    konto=datax2[4];
                    if (datax2[2]=='1') { app_manage=1; } else { app_manage=0; }
                    if (datax2[9]=='1') { app_ukony=1; } else { app_ukony=0; }
                    if (datax2[2]=='1' && datax2[9]=='0') { $('#managebutton').click(); }
                    if (datax2[9]=='1') { $("#ukony").click(); $('input:radio[name=offline]').filter('[value=0]').prop('checked', true); }
                    //if (datax2[7]=='1') { $("#zavri").show(); app_off=1; } else { app_off=0; }
                    allStop();
                }
            },
            error: function(datax){
                alert("Chyba: pravdepodobne nie ste pripojení na internet");
                resetnfcfing(false);
            }
        });
    }
}

$("#ukon_scan")
  .off("click")
  .on("click", async function () {
    const BarcodeScanner = getBarcodeScannerPlugin();

    // NÁHRADA za pôvodné:
    // if (!window.cordova || !window.cordova.plugins || !window.cordova.plugins.barcodeScanner) { ... }
    if (!BarcodeScanner) {
      alert("Skenovanie kódu nie je dostupné (Capacitor BarcodeScanner).");
      return;
    }

    try {
      // 1) Povolenia ku kamere – rovnaký štýl ako pri #login_code
      try {
        const perm = await BarcodeScanner.requestPermissions();
        const status = (perm && perm.camera) || perm;

        if (status !== "granted" && status !== "limited") {
          const openSettings = confirm(
            "Aplikácia nemá povolený prístup ku kamere.\n\n" +
              "Bez toho nemožno skenovať.\n\n" +
              "Chcete zobraziť inštrukcie, ako to povoliť v nastaveniach?"
          );

          if (openSettings) {
            if (typeof BarcodeScanner.openSettings === "function") {
              try {
                await BarcodeScanner.openSettings();
              } catch (e) {
                alert(
                  "Nemožno automaticky otvoriť nastavenia.\n\n" +
                    "Prosím, povoľte kameru ručne v nastaveniach telefónu."
                );
              }
            } else {
              alert(
                "Prosím, povoľte kameru ručne v nastaveniach telefónu:\n\n" +
                  "Nastavenia → Aplikácie → DODS Úkony → Povolenia → Kamera."
              );
            }
          }

          // bez povolenia nepokračujeme
          return;
        }
      } catch (e) {
        console.log("[UKON_SCAN] requestPermissions error", e);
        // necháme pokračovať, aby sa správalo čo najpodobnejšie pôvodnému
      }

      // 2) Samotné skenovanie – náhrada za cordova.plugins.barcodeScanner.scan(...)
      const result = await BarcodeScanner.scan();
      const first = result && result.barcodes && result.barcodes[0];

      // Pôvodne: if (!result.cancelled) { ... }
      // Teraz: ak nie je žiadny kód, tvárime sa ako "cancelled" → nič nerobíme.
      if (!first) {
        return;
      }

      const scannedCode =
        first.rawValue || first.displayValue || first.raw || "";

      if (!scannedCode) {
        alert("Kód sa nepodarilo prečítať.");
        return;
      }

      // 3) PÔVODNÁ LOGIKA – len sme nahradili result.text → scannedCode
      if ($('input[name=offline]:checked').val() == "1") {
        // OFFLINE vetva
        typ_code = scannedCode.substr(0, 1);

        if (typ_code == "3" || typ_code == "6") {
          id_code = Number(scannedCode.substr(1, 5));
          id_code2 = Number(scannedCode.substr(6, 6));
        } else {
          id_code = Number(scannedCode.substr(1, 11));
        }

        if (typ_code == "5") {
          id_code = -id_code;
        }
        if (typ_code == "6") {
          id_code2 = -id_code2;
        }

        if (
          typ_code == "1" &&
          scannedCode.length == 13 &&
          id_code in klienti_names
        ) {
          $("#loaddata").text("");
          ukon_klient = id_code;
          $("#klient_data").html(klienti_names[id_code]);
          $("#delklient_data").show();
          if (codes == "") {
            codes = scannedCode;
          } else {
            codes += "," + scannedCode;
          }
          if (ukon_id != 0) {
            codes2 =
              klienti_names[ukon_klient] +
              ": " +
              ukony_names[ukon_id] +
              "<br>" +
              codes2;
          }
        } else if (
          (typ_code == "2" || typ_code == "5") &&
          scannedCode.length == 13 &&
          id_code in ukony_names
        ) {
          $("#loaddata").text("");
          ukon_id = id_code;
          $("#ukon_data").html(ukony_names[id_code]);
          $("#delukon_data").show();
          if (codes == "") {
            codes = scannedCode;
          } else {
            codes += "," + scannedCode;
          }
          if (ukon_klient != 0) {
            codes2 =
              klienti_names[ukon_klient] +
              ": " +
              ukony_names[ukon_id] +
              "<br>" +
              codes2;
          }

      alert('Karta neobsahuje dáta (NDEF) potrebné pre IOS. Použite inú kartu alebo kontaktujte technickú podporu.');

      return;
  }
}

if (idBytes && idBytes.length) {

    nfcDebugLog('📦 UID BYTES: ' + JSON.stringify(idBytes));

    finalId = idBytes;

} else {
    nfcDebugLog('❌ NO ID FOUND');
    return;
}

                            const sendtoEvent = {
                                tag: {
                                    id: finalId
                                }
                            };

                            nfcDebugLog('➡️ SENDING TO APP');

                            activeCallbacks.forEach(function (cb) {
                                try {
                                    cb(sendtoEvent);
                                } catch (e) {
                                    nfcDebugLog('❌ CALLBACK ERROR');
                                }
                            });

                        });
                    }
console.log('[NFC] startScanning CALL');
                    await CapacitorNfc.startScanning({
                        invalidateAfterFirstRead: false
                    });
                    scanning = true;
                } catch (e) {
                    console.error('[NFC] startScanning error', e);
                    throw e;
                }
            }

            window.nfc = {
                addTagDiscoveredListener: function (callback, success, failure) {
                
                
                console.log('[NFC DEBUG] addTagDiscoveredListener called');
                console.trace();

                    if (typeof callback !== 'function') {
                        console.warn('[NFC] addTagDiscoveredListener bez callbacku');
                   

                        if (typeof failure === 'function') {
                            failure(new Error('callback is not a function'));
                        }
                        return;
                    }

                    activeCallbacks.add(callback);

                    ensureScanning()
                        .then(function () {
                            if (typeof success === 'function') success();
                            if (window.nfcwin && typeof window.nfcwin === 'function') {
                                try { window.nfcwin(); } catch (e) { console.error(e); }
                            }
                        })
                        .catch(function (err) {
                            if (typeof failure === 'function') failure(err);
                            if (window.nfcfail && typeof window.nfcfail === 'function') {
                                try { window.nfcfail(err); } catch (e) { console.error(e); }
                            }
                        });
                },

                removeTagDiscoveredListener: function (callback, success, failure) {
                    try {
                        if (callback && activeCallbacks.has(callback)) {
                            activeCallbacks.delete(callback);
                        }

                        // Android - nikdy nevypínaj scanning
                        // iOS nechaj pôvodné správanie
                        if (
                            activeCallbacks.size === 0 &&
                            scanning &&
                            /iPad|iPhone|iPod/.test(navigator.userAgent)
                        ) {
                            CapacitorNfc.stopScanning().catch(function (e) {
                                console.error('[NFC] stopScanning error', e);
                            });

                            scanning = false;
                        }

                        if (typeof success === 'function') success();

                    } catch (err) {
                        console.error('[NFC] removeTagDiscoveredListener error', err);
                    }
                },

                bytesToHexString: function (bytes) {
                    if (!bytes) return '';
                    return Array.from(bytes, function (b) {
                        b = b & 0xff;
                        return ('0' + b.toString(16)).slice(-2);
                    }).join('');
                }
            };
        })();

        // ---------- BARCODE SCANNER SHIM (Capacitor BarcodeScanner -> cordova.plugins.barcodeScanner) ----------
        (function () {
            // Ak už existuje pôvodný Cordova plugin, necháme ho tak
            if (window.cordova && window.cordova.plugins && window.cordova.plugins.barcodeScanner) {
                console.log('[BarcodeScanner] Cordova plugin už existuje, shim nepotrebný.');
                return;
            }

            const plugins = (window.Capacitor && window.Capacitor.Plugins) || {};
            const CapBarcode = plugins.BarcodeScanner;

            // Vytvoríme základnú štruktúru cordova.plugins, ak neexistuje
            window.cordova = window.cordova || {};
            window.cordova.plugins = window.cordova.plugins || {};

            if (!CapBarcode || typeof CapBarcode.scan !== 'function') {
                console.log('[BarcodeScanner] Capacitor BarcodeScanner plugin nie je dostupný, vytváram dummy scan().');
                window.cordova.plugins.barcodeScanner = {
                    scan: function (success, error, options) {
                        console.log('[BarcodeScanner] scan volaný bez natívnej podpory.');
                        if (typeof error === 'function') {
                            error('BarcodeScanner plugin nie je dostupný');
                        } else {
                            alert('BarcodeScanner plugin nie je dostupný.');
                        }
                    }
                };
                return;
            }

            console.log('[BarcodeScanner] Používam Capacitor BarcodeScanner plugin ako Cordova shim.');

            window.cordova.plugins.barcodeScanner = {
                scan: function (success, error, options) {
                    CapBarcode.scan()
                        .then(function (result) {
                            // Očakávaný tvar z @capacitor/barcode-scanner:
                            // { hasContent: boolean, content: string | null }
                            if (!result) {
                                if (typeof success === 'function') {
                                    success({ text: '', cancelled: true });
                                }
                                return;
                            }

                            const hasContent = !!result.hasContent;
                            const text = result.content || '';

                            if (typeof success === 'function') {
                                success({
                                    text: text,
                                    cancelled: !hasContent
                                });
                            }
                        })
                        .catch(function (err) {
                            console.error('[BarcodeScanner] scan error', err);
                            if (typeof error === 'function') {
                                error(err);
                            } else {
                                alert('Naskenovanie kódu sa nepodarilo: ' + err);
                            }
                        });
                }
            };
        })();
        
        console.log('Plugins:', Capacitor.Plugins);
