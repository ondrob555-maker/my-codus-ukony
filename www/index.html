        <!-- cordova.js ZÁMERNE NEPOUŽÍVAME -->

    <body>
        <script>
        const DEBUG_ENABLED = false;

        window.debugConsole = function () {
          if (!DEBUG_ENABLED) return;

          try {
            console.log.apply(console, arguments);
          } catch (e) {}
        };

        var debugConsole = window.debugConsole;

        debugConsole('APP INIT');
  
        const isIOS = window.Capacitor && Capacitor.getPlatform() === 'ios';
        var konto=0;
        var first=1;
        var app_manage=0;
        var app_off=0;
        var app_ukony=0;
        var ukon_klient=0;
        var ukon_id=0;
        var codes=''; // kody
        var codes2=''; // hodnoty kodov
        const klienti_names = [];
        const ukony_names = [];
        const ukony_hodns = [];
        const prukony_names = [];
        var nfcLockUntil = 0; // dokedy je NFC zamknuté (ms od epoch)

        function nfcDebugLog(msg) {
            debugConsole('[NFC DEBUG]', msg);

            var el = document.getElementById('nfcDebug');
            if (!el) return;

            el.innerHTML += msg + "<br>";
            el.scrollTop = el.scrollHeight;
        }
        
        // NFC: vibrácia + beep
        var userHasInteracted = false;

        function markUserInteraction() {
            userHasInteracted = true;
        }

        document.addEventListener('pointerdown', markUserInteraction, { once: true });
        document.addEventListener('keydown', markUserInteraction, { once: true });

        function canVibrate() {
            return (
                userHasInteracted &&
                typeof navigator !== 'undefined' &&
                typeof navigator.vibrate === 'function'
            );
        }

        function notifyNfcTagRead() {
            debugConsole('[NFC] TAG READ');

            try {
                if (canVibrate()) {
                    navigator.vibrate(200);
                }
            } catch (e) {
                debugConsole('[NFC] vibrácia chyba', e);
            }

            try {
                var beep = document.getElementById('nfcBeep');
                if (beep && typeof beep.play === 'function') {
                    beep.currentTime = 0;
                    beep.play().catch(function(){});
                }
            } catch (e) {
                debugConsole('[NFC] beep chyba', e);
            }
        }

        // NFC smie fungovať iba na login + Przypisz kartę
        function isNfcAllowedForOver() {
            // Login obrazovka: panel s kódom + text "Przyłóż kartę"
            // (= sme na úvodnej obrazovke, kde je #loggedbutton a text s #overidentituON)
            return (
                $('#loggedbutton').is(':visible') &&
                $('#overidentituON').is(':visible')
            );
        }

        function isNfcAllowedForSave() {
            // Przypisz kartę: sme v správe prístupov a otvorený blok na priraďovanie karty
            // -> toto *úmyselne* NEplatí pre "Usuń kartę"
            return (
                $('#showmanagebutton').is(':visible') &&
                $('#showpridelnfc').is(':visible')
            );
        }

        function getBarcodeScannerPlugin() {
            const cap = (window.Capacitor && window.Capacitor.Plugins) || {};
            if (cap.BarcodeScanner) {
                return cap.BarcodeScanner;
            }

            // fallback: ak je k dispozícii pôvodný cordovský plugin
            if (window.cordova && window.cordova.plugins && window.cordova.plugins.barcodeScanner) {
                return {
                    // zrýchlený wrapper, aby sme mali async/await
                    async scan() {
                        return new Promise(function (resolve, reject) {
                            window.cordova.plugins.barcodeScanner.scan(
                                function (res) {
                                    // prevedieme na podobný tvar ako Capacitor
                                    if (res && !res.cancelled) {
                                        resolve({ barcodes: [{ rawValue: res.text }] });
                                    } else {
                                        resolve({ barcodes: [] });
                                    }
                                },
                                function (err) {
                                    reject(err);
                                }
                            );
                        });
                    },
                    async requestPermissions() {
                        // pôvodný cordovský plugin nemal requestPermissions -> tvárime sa že povolené
                        return { camera: "granted" };
                    }
                };
            }

            return null;
        }


        window.onload = function() {
        
        prepareBarcodeScanner();
        
            let APP_VERSION = '1.0.1(codus-ukony)';
            if (isIOS) APP_VERSION = '1.0.1(codus-ukony)-ios';
            
            document.getElementById('appVersion').textContent = 'v. '+APP_VERSION.split('(')[0].trim();

            $.ajaxSetup({
              data: {
                app_source: 'capacitor',
                app_version: APP_VERSION
              }
            });

            $.ajaxPrefilter(function(options) {

              if (
                options.type &&
                options.type.toUpperCase() === 'POST'
              ) {

                if (typeof options.data === 'string') {

                  options.data +=
                    '&app_source=capacitor'
                    + '&app_version='
                    + encodeURIComponent(APP_VERSION);

                } else {

                  options.data = options.data || {};

                  options.data.app_source = 'capacitor';
                  options.data.app_version = APP_VERSION;
                }
              }
            });    
            
           async function prepareBarcodeScanner() {
              try {
                  const BarcodeScanner = getBarcodeScannerPlugin();

                  if (!BarcodeScanner) {
                      debugConsole('[BARCODE] plugin nenájdený');
                      return;
                  }

                  if (
                      typeof BarcodeScanner.isGoogleBarcodeScannerModuleAvailable !== 'function'
                  ) {
                      debugConsole('[BARCODE] Google module API nie je dostupné');
                      return;
                  }

                  const status =
                      await BarcodeScanner.isGoogleBarcodeScannerModuleAvailable();

                  debugConsole('[BARCODE] module available:', status.available);

                  if (status.available) {
                      return;
                  }

                  debugConsole('[BARCODE] spúšťam inštaláciu modulu');

                  await BarcodeScanner.installGoogleBarcodeScannerModule();

                  await BarcodeScanner.addListener(
                      'googleBarcodeScannerModuleInstallProgress',
                      function (event) {

                          debugConsole(
                              '[BARCODE INSTALL]',
                              event.state,
                              event.progress
                          );

                          if (event.state === 4) {
                              debugConsole(
                                  '[BARCODE] Google Barcode Scanner úspešne nainštalovaný'
                              );
                          }

                          if (event.state === 5) {
                              debugConsole(
                                  '[BARCODE] Inštalácia zlyhala'
                              );
                          }
                      }
                  );

              } catch (e) {
                  debugConsole('[BARCODE] prepare error', e);
              }
          }                  
            
            var unicards=['0463e532093c80'];

            // ===== idle handler + fake NFC režim (ako v my-codus-strava) =====
            function idleNfcHandler (nfcEvent) {
                debugConsole('[NFC] idle handler – tag ignorovaný', nfcEvent);
            }

            function activateFakeNfcOnly () {
                debugConsole('[NFC] Fake režim – ponechávam len idleNfcHandler');

                // Zrušíme všetky "skutočné" NFC handlery
                try { nfc.removeTagDiscoveredListener(overNfc, nfcwin, nfcfail); } catch(e){}
                try { nfc.removeTagDiscoveredListener(saveNfc, nfcwin, nfcfail); } catch(e){}

                // Pre istotu zaregistrujeme idle handler (v shime sa neduplikuje)
                try { nfc.addTagDiscoveredListener(idleNfcHandler, nfcwin, nfcfail); } catch(e){}

                // UI – senzory OFF
                $('#overidentituOFF').show();
                $('#overidentituON').hide();
            }
            // ======================================================================

            function removeTags(str) {
                if ((str === null) || (str === ''))
                    return false;
                else
                    str = str.toString();
                return str.replace(/(<([^>]+)>)/ig, '');
            }

            // ignoreLock = true -> ignoruje lock + ZMAŽE ho (napr. pri logoute)
            function resetnfcfing(ignoreLock) {
                var now = Date.now();

                if (!ignoreLock && nfcLockUntil && now < nfcLockUntil) {
                    var seconds = Math.ceil((nfcLockUntil - now) / 1000);
                    alert('Czytnik kart będzie dostępny za około ' + seconds + ' sekund.');
                    return;
                }

                // ak máme lock ignorovať, rovno ho zrušíme
                if (ignoreLock) {
                    nfcLockUntil = 0;
                }

                // vypneme všetko
                allStop();
                // zrušíme prípadný idle handler (fake režim)
                try { nfc.removeTagDiscoveredListener(idleNfcHandler, nfcwin, nfcfail); } catch(e){}

                // a po krátkej pauze znovu zapneme reálny overNfc
                setTimeout(function(){
                    try { nfc.addTagDiscoveredListener(overNfc, nfcwin, nfcfail); } catch(e){}
                    $('#overidentituON').show();
                    $('#overidentituOFF').hide();
                }, 500);
            }

            $("#overidentituON,#overidentituOFF").click(function() {
                resetnfcfing(false);
            });

            function allStop() {
                try { nfc.removeTagDiscoveredListener(overNfc, nfcwin, nfcfail); } catch(e){}
                $('#overidentituOFF').show();
                $('#overidentituON').hide();
            }

            function saveNfc(nfcEvent) {
                // 🔒 Povolené len na obrazovke "Przypisz kartę"
                if (!isNfcAllowedForSave()) {
                    debugConsole('[NFC] Tag ignorovaný – saveNfc mimo obrazovky Przypisz kartę', nfcEvent);
                    return;
                }

                // sme v režime Przypisz kartę → vibra + pípnutie
                notifyNfcTagRead();

                var tag = nfcEvent.tag;
                var tagId = nfc.bytesToHexString(tag.id);
                $.ajax({
                    type: "POST",
                    url:  "https://codu2.let.is/app_load.php",
                    data: { co: 'add_nfc', kto: $('#zampridelnfc').val(), kod: tagId },
                    cache: false,
                    dataType: "text",
                    success: function(datax){
                        if (datax=='ok') {
                            alert('Karta została pomyślnie zapisana w bazie danych!');
                        } else {
                            alert('Nie udało się zapisać karty w bazie danych. Spróbuj ponownie!');
                        }
                        $('#zampridelnfc').find('option').remove();
                        $('#submenu').text('');
                        $('#showoffline').hide();
                        $("#pridelnfc").show();
                        $("#odobernfc").show();
                        debugConsole('[NFC] Odobernfc visible is:', $("#odobernfc").is(":visible"));
                        $('#showpridelnfc').hide();
                        nfc.removeTagDiscoveredListener(saveNfc, nfcwin, nfcfail);
                    },
                    error: function(datax){
                        alert("Błąd: prawdopodobnie nie masz połączenia z internetem");
                        nfc.removeTagDiscoveredListener(saveNfc, nfcwin, nfcfail);
                    }
                });
            }


            function overNfc(nfcEvent) {
                // 🔒 Povolené len na login obrazovke s textom "Przyłóż kartę"
                if (!isNfcAllowedForOver()) {
                    debugConsole('[NFC] Tag ignorovaný – overNfc mimo povolenej obrazovky', nfcEvent);
                    return;
                }

                var now = Date.now();
                if (nfcLockUntil && now < nfcLockUntil) {
                    debugConsole('[NFC] Tag ignorovaný – v lock intervale', nfcEvent);
                    return;
                }

                // nastaviť 2-minútový lock a pustiť fake NFC (idle handler)
                nfcLockUntil = now + 3000; // 3 sekundy
                //activateFakeNfcOnly();

                // sme na správnej obrazovke → vibra + pípnutie
                notifyNfcTagRead();

            var tag = nfcEvent.tag;
            var tagId;

            if (typeof tag.id === 'string') {
                // iOS → už je to hotový HEX string
                tagId = tag.id.trim().toLowerCase();
                nfcDebugLog('🍏 USING STRING ID: ' + tagId);
            } else {
                // Android → prevedieme bytes na hex
                tagId = nfc.bytesToHexString(tag.id);
                nfcDebugLog('🤖 USING BYTES ID: ' + tagId);
            }
                if (unicards.indexOf(tagId)>=0) {
                    zamestnanec=0;
                    konto=0; // senecio
                    $('#logged').text("Witamy ADMIN");
                    $('#showoffline').hide();
                    $('#loggedbutton').hide();
                    $('#managebutton').hide();
                    $('#logout').show();
                    //$('#zavri').show();
                    allStop();
                } else {
                    $.ajax({
                        type: "POST",
                        url:  "https://codu2.let.is/app_load.php",
                        data: { co: 'over_nfc', kod: tagId },
                        cache: false,
                        dataType: "text",
                        success: function(datax){
                            if (datax=='fail') {
                                alert('Ta karta nie jest przypisana do żadnej osoby w bazie danych.');
                                resetnfcfing(false);
                            } else {
                                datax2=datax.split('|');
                                zamestnanec=datax2[0];
                                $('#logged').text("Witamy "+datax2[1]);
                                $('#loggedbutton').hide();
                                $('#logout').show();
                                konto=datax2[4];
                                if (datax2[2]=='1') { app_manage=1; } else { app_manage=0; }
                                if (datax2[9]=='1') { app_ukony=1; } else { app_ukony=0; }
                                if (datax2[2]=='1' && datax2[9]=='0') { $('#managebutton').click(); }
                                if (datax2[9]=='1') { $("#ukony").click(); $('input:radio[name=offline]').filter('[value=0]').prop('checked', true); }
                                //if (datax2[7]=='1') { $("#zavri").show(); app_off=1; } else { app_off=0; }
                                allStop();
                            }
                        },
                        error: function(datax){
                            alert("Błąd: prawdopodobnie nie masz połączenia z internetem");
                            resetnfcfing(false);
                        }
                    });
                }
            }

            function loadukonneuz() {
                if (!$("#showukon_neuz").is(":visible")) {return;};
                $("#showukon_neuz").html('<br><b>Wczytywanie...</b>');
                $.ajax({
                    type: "POST",
                    url:  "https://codu2.let.is/app_load.php",
                    data: { co: 'loadukonneuz', konto: konto, kto: zamestnanec, klient: ukon_klient, ukon: ukon_id },
                    cache: false,
                    dataType: "text",
                    success: function(datax){
                        if (datax=='fail') {
                            alert('Nie udało się wczytać niezakończonych czynności.');
                        } else {
                            $("#showukon_neuz").html(datax);
                        }
                    },
                    error: function(datax){
                        alert("Błąd: prawdopodobnie nie masz połączenia z internetem");
                        resetnfcfing(false);
                    }
                });
            }

            function pushkl(item, index) {
                var getdata=item.split('^');
                klienti_names[getdata[0]]=getdata[1];
            }
            function pushuk(item, index) {
                var getdata=item.split('^');
                ukony_names[getdata[0]]=getdata[1];
                ukony_hodns[getdata[0]]=getdata[2];
            }
            function pushpruk(item, index) {
                var getdata=item.split('^');
                prukony_names[getdata[0]]=getdata[1];
            }

            function loaddata() {
                $("#ukon_scan").hide();
                $("#loaddata").html("<br>Wczytywanie danych... <img src='img/time.png' alt='?'>");
                $.ajax({
                    type: "POST",
                    url:  "https://codu2.let.is/app_load.php",
                    data: { co: 'loadcodes', konto: konto },
                    cache: false,
                    dataType: "text",
                    success: function(datax){
                        // idkl^nazkl|idkl^nazkl..#iduk^nazuk^hodnuk|iduk^nazuk^hodnuk..#idpruk^nazpruk|idpruk^nazpruk..
                        const klienti_names = [];
                        const ukony_names = [];
                        const ukony_hodns = [];
                        const prukony_names = [];
                        datax2=datax.split('#');
                        datax2[0].split('|').forEach(pushkl);
                        datax2[1].split('|').forEach(pushuk);
                        datax2[2].split('|').forEach(pushpruk);
                        $("#ukon_scan").show();
                        $("#loaddata").text('');
                    },
                    error: function(datax){
                        alert("Błąd: prawdopodobnie nie masz połączenia z internetem");
                        resetnfcfing(false);
                    }
                });
            }

            function safeExitApp() {
              try {
                const plugins = (window.Capacitor && (Capacitor.Plugins || {})) || {};
                const App = plugins.App || (window.Capacitor && Capacitor.App);

                if (App && typeof App.exitApp === 'function') {
                  App.exitApp();
                  return;
                }
              } catch (e) {
                debugConsole('[App] exitApp error:', e);
              }

              if (navigator.app && typeof navigator.app.exitApp === 'function') {
                navigator.app.exitApp();
              }
            }

            $("#ukony").click(function() {
                $("#submenu").text(' - rejestr czynności');
                $('#showoffline').show();
                $('#managebutton').hide();
                //$('#zavri').hide();
                $('#ukony').hide();
                //$('#logout').hide();
                $(".ukon_hodnotabr").hide();
                $("#ukon_hodnota1").hide();
                $("#ukon_hodnotalom").hide();
                $("#ukon_hodnota2").hide();
                $("#ukon_hodnota_zapis").hide();
                $('#showukony').show();
                $("input[name=offline][value=0]").prop('checked', true);
                //$("#navrat").show();
            });

            $("#managebutton").click(function() {
                $("#submenu").text(' - zarządzanie dostępem');
                $('#showoffline').hide();
                $('#managebutton').hide();
                //$('#zavri').hide();
                $('#ukony').hide();
                //$('#logout').hide();
                $("#showmanagebutton").show();
                $("#showpridelnfc").hide();
                $("#showodobernfc").hide();
                $("#pridelnfc").show();
                $("#odobernfc").show();
                //$("#navrat").show();
            });

            $("#ukon_neuz").click(function() {
                $(".ukon_hodnotabr").hide();
                $("#ukon_hodnota1").hide();
                $("#ukon_hodnotalom").hide();
                $("#ukon_hodnota2").hide();
                $("#ukon_hodnota_zapis").hide();
                $("#showukon_neuz").toggle();
                loadukonneuz();
            });

            $("#save_kody").click(function() {
                if (codes!='') {
                    $.ajax({
                        type: "POST",
                        url:  "https://codu2.let.is/app_load.php",
                        data: { co: 'save_kody', konto: konto, kto: zamestnanec, kody: codes },
                        cache: false,
                        dataType: "text",
                        success: function(datax){
                            $("#showcodes").text('');
                            $("#loaddata").html('<br>'+datax);
                            codes='';
                            codes2='';
                            ukon_klient=0;
                            ukon_id=0;
                            $("#klient_data").text('');
                            $("#delklient_data").hide();
                            $("#ukon_data").text('');
                            $("#delukon_data").hide();
                        },
                        error: function(datax){
                            alert("Błąd: prawdopodobnie nie masz połączenia z internetem");
                        }
                    });

                }
            });

            $('input[type=radio][name=offline]').change(function() {
                const klienti_names = [];
                const ukony_names = [];
                const ukony_hodns = [];
                const prukony_names = [];
                if (this.value == '1') { loaddata(); } else { $("#loaddata").text(''); }
                $("#showcodes").text('');
                codes='';
                codes2='';
                ukon_klient=0;
                ukon_id=0;
                $("#klient_data").text('');
                $("#delklient_data").hide();
                $("#ukon_data").text('');
                $("#delukon_data").hide();
                $(".ukon_hodnotabr").hide();
                $("#ukon_hodnota1").hide();
                $("#ukon_hodnotalom").hide();
                $("#ukon_hodnota2").hide();
                $("#ukon_hodnota_zapis").hide();
            });

          $("#ukon_scan")
            .off("click")
            .on("click", async function () {
              const BarcodeScanner = getBarcodeScannerPlugin();

              // NÁHRADA za pôvodné:
              // if (!window.cordova || !window.cordova.plugins || !window.cordova.plugins.barcodeScanner) { ... }
              if (!BarcodeScanner) {
                alert("Skanowanie kodu jest niedostępne (Capacitor BarcodeScanner).");
                return;
              }

              try {
                // 1) Povolenia ku kamere – rovnaký štýl ako pri #login_code
                try {
                  const perm = await BarcodeScanner.requestPermissions();
                  const status = (perm && perm.camera) || perm;

                  if (status !== "granted" && status !== "limited") {
                    const openSettings = confirm(
                      "Aplikacja nie ma dostępu do aparatu.\n\n" +
                        "Bez tego skanowanie nie jest możliwe.\n\n" +
                        "Czy chcesz wyświetlić instrukcję, jak zezwolić na dostęp w ustawieniach?"
                    );

                    if (openSettings) {
                      if (typeof BarcodeScanner.openSettings === "function") {
                        try {
                          await BarcodeScanner.openSettings();
                        } catch (e) {
                          alert(
                            "Nie można automatycznie otworzyć ustawień.\n\n" +
                              "Zezwól na dostęp do aparatu ręcznie w ustawieniach telefonu."
                          );
                        }
                      } else {
                        alert(
                          "Zezwól na dostęp do aparatu ręcznie w ustawieniach telefonu:\n\n" +
                            "Ustawienia → Aplikacje → CODUS Rejestr czynności → Uprawnienia → Aparat."
                        );
                      }
                    }

                    // bez povolenia nepokračujeme
                    return;
                  }
                } catch (e) {
                  debugConsole("[UKON_SCAN] requestPermissions error", e);
                  // necháme pokračovať, aby sa správalo čo najpodobnejšie pôvodnému
                }

                // 2) Samotné skenovanie – náhrada za cordova.plugins.barcodeScanner.scan(...)
                const result = await BarcodeScanner.scan();
                const first = result && result.barcodes && result.barcodes[0];

                // Pôvodne: if (!result.cancelled) { ... }
                // Teraz: ak nie je žiadny kód, tvárime sa ako "cancelled" → nič nerobíme.
                if (!first) {
                  return;
                }

                const scannedCode =
                  first.rawValue || first.displayValue || first.raw || "";

                if (!scannedCode) {
                  alert("Nie udało się odczytać kodu.");
                  return;
                }

                // 3) PÔVODNÁ LOGIKA – len sme nahradili result.text → scannedCode
                if ($('input[name=offline]:checked').val() == "1") {
                  // OFFLINE vetva
                  typ_code = scannedCode.substr(0, 1);

                  if (typ_code == "3" || typ_code == "6") {
                    id_code = Number(scannedCode.substr(1, 5));
                    id_code2 = Number(scannedCode.substr(6, 6));
                  } else {
                    id_code = Number(scannedCode.substr(1, 11));
                  }

                  if (typ_code == "5") {
                    id_code = -id_code;
                  }
                  if (typ_code == "6") {
                    id_code2 = -id_code2;
                  }

                  if (
                    typ_code == "1" &&
                    scannedCode.length == 13 &&

                            } catch (e) {
                                nfcDebugLog('❌ PARSE ERROR');
                                return;
                            }

                            nfcDebugLog('RAW: ' + JSON.stringify(safeEvent));

                            let idBytes = null;
                            let finalValue = null;
                            let finalId;

                            // ✅ ANDROID UID
                            if (safeEvent && safeEvent.tag && safeEvent.tag.id) {
                                idBytes = safeEvent.tag.id;
                                nfcDebugLog('✅ ANDROID UID FOUND');

                                let hex = '';

                                for (let i = 0; i < idBytes.length; i++) {
                                    let h = (idBytes[i] & 0xff).toString(16);
                                    if (h.length === 1) h = '0' + h;
                                    hex += h;
                                }

                                finalValue = hex;
                                nfcDebugLog('🎯 ANDROID HEX: ' + hex);
                            }


                            // 🍏 iOS – NDEF TEXT (FIXED ACCESS)
                            if (!finalValue) {
                              const payload = findPayload(event);

                              if (payload && payload.length) {
                                  try {
                                      const bytes = new Uint8Array(payload);
                                      const langLength = bytes[0];
                                      const textBytes = bytes.slice(1 + langLength);

                                      const text = new TextDecoder().decode(textBytes);

                                      nfcDebugLog('🍏 iOS TEXT: ' + text);

                                      const sendtoEvent = {
                                          tag: {
                                              id: text
                                          }
                                      };

                                      nfcDebugLog('➡️ SENDING iOS TEXT');

                                      activeCallbacks.forEach(function (cb) {
                                          try {
                                              cb(sendtoEvent);
                                          } catch (e) {
                                              nfcDebugLog('❌ CALLBACK ERROR');
                                          }
                                      });

                                      return; // 🔥 DÔLEŽITÉ – zastaví ďalší kód
                                  } catch (e) {
                                      nfcDebugLog('❌ iOS decode error');
                                  }
                             } else {
                                  const now = Date.now();

                                  // ochrana proti spamovaniu alertu
                                  if (nfcLockUntil && now < nfcLockUntil) {
                                      return;
                                  }

                                  // nastav lock napr. 3 sekundy
                                  nfcLockUntil = now + 3000;

                                  alert('Karta nie zawiera danych (NDEF) wymaganych przez iOS. Użyj innej karty lub skontaktuj się z pomocą techniczną.');

                                  return;
                              }
                            }

                            if (idBytes && idBytes.length) {

                                nfcDebugLog('📦 UID BYTES: ' + JSON.stringify(idBytes));

                                finalId = idBytes;

                            } else {
                                nfcDebugLog('❌ NO ID FOUND');
                                return;
                            }

                            const sendtoEvent = {
                                tag: {
                                    id: finalId
                                }
                            };

                            nfcDebugLog('➡️ SENDING TO APP');

                            activeCallbacks.forEach(function (cb) {
                                try {
                                    cb(sendtoEvent);
                                } catch (e) {
                                    nfcDebugLog('❌ CALLBACK ERROR');
                                }
                            });

                        });
                    }
                    debugConsole('[NFC] startScanning CALL');
                    await CapacitorNfc.startScanning({
                        invalidateAfterFirstRead: false
                    });
                    scanning = true;
                } catch (e) {
                    debugConsole('[NFC] startScanning error', e);
                    throw e;
                }
            }

            window.nfc = {
                addTagDiscoveredListener: function (callback, success, failure) {
                
                
                debugConsole('[NFC DEBUG] addTagDiscoveredListener called');
                if (DEBUG_ENABLED) console.trace();

                    if (typeof callback !== 'function') {
                        console.warn('[NFC] addTagDiscoveredListener bez callbacku');
                   

                        if (typeof failure === 'function') {
                            failure(new Error('callback is not a function'));
                        }
                        return;
                    }

                    activeCallbacks.add(callback);

                    ensureScanning()
                        .then(function () {
                            if (typeof success === 'function') success();
                            if (window.nfcwin && typeof window.nfcwin === 'function') {
                                try { window.nfcwin(); } catch (e) { debugConsole(e); }
                            }
                        })
                        .catch(function (err) {
                            if (typeof failure === 'function') failure(err);
                            if (window.nfcfail && typeof window.nfcfail === 'function') {
                                try { window.nfcfail(err); } catch (e) { debugConsole(e); }
                            }
                        });
                },

                removeTagDiscoveredListener: function (callback, success, failure) {
                    try {
                        if (callback && activeCallbacks.has(callback)) {
                            activeCallbacks.delete(callback);
                        }

                        // Android - nikdy nevypínaj scanning
                        // iOS nechaj pôvodné správanie
                        if (
                            activeCallbacks.size === 0 &&
                            scanning &&
                            /iPad|iPhone|iPod/.test(navigator.userAgent)
                        ) {
                            CapacitorNfc.stopScanning().catch(function (e) {
                                debugConsole('[NFC] stopScanning error', e);
                            });

                            scanning = false;
                        }

                        if (typeof success === 'function') success();

                    } catch (err) {
                        debugConsole('[NFC] removeTagDiscoveredListener error', err);
                    }
                },

                bytesToHexString: function (bytes) {
                    if (!bytes) return '';
                    return Array.from(bytes, function (b) {
                        b = b & 0xff;
                        return ('0' + b.toString(16)).slice(-2);
                    }).join('');
                }
            };
        })();

        // ---------- BARCODE SCANNER SHIM (Capacitor BarcodeScanner -> cordova.plugins.barcodeScanner) ----------
        (function () {
            // Ak už existuje pôvodný Cordova plugin, necháme ho tak
            if (window.cordova && window.cordova.plugins && window.cordova.plugins.barcodeScanner) {
                debugConsole('[BarcodeScanner] Cordova plugin už existuje, shim nepotrebný.');
                return;
            }

            const plugins = (window.Capacitor && window.Capacitor.Plugins) || {};
            const CapBarcode = plugins.BarcodeScanner;

            // Vytvoríme základnú štruktúru cordova.plugins, ak neexistuje
            window.cordova = window.cordova || {};
            window.cordova.plugins = window.cordova.plugins || {};

            if (!CapBarcode || typeof CapBarcode.scan !== 'function') {
                debugConsole('[BarcodeScanner] Capacitor BarcodeScanner plugin nie je dostupný, vytváram dummy scan().');
                window.cordova.plugins.barcodeScanner = {
                    scan: function (success, error, options) {
                        debugConsole('[BarcodeScanner] scan volaný bez natívnej podpory.');
                        if (typeof error === 'function') {
                            error('BarcodeScanner plugin nie je dostupný');
                        } else {
                            alert('BarcodeScanner plugin nie je dostupný.');
                        }
                    }
                };
                return;
            }

            debugConsole('[BarcodeScanner] Používam Capacitor BarcodeScanner plugin ako Cordova shim.');

            window.cordova.plugins.barcodeScanner = {
                scan: function (success, error, options) {
                    CapBarcode.scan()
                        .then(function (result) {
                            // Očakávaný tvar z @capacitor/barcode-scanner:
                            // { hasContent: boolean, content: string | null }
                            if (!result) {
                                if (typeof success === 'function') {
                                    success({ text: '', cancelled: true });
                                }
                                return;
                            }

                            const hasContent = !!result.hasContent;
                            const text = result.content || '';

                            if (typeof success === 'function') {
                                success({
                                    text: text,
                                    cancelled: !hasContent
                                });
                            }
                        })
                        .catch(function (err) {
                            debugConsole('[BarcodeScanner] scan error', err);
                            if (typeof error === 'function') {
                                error(err);
                            } else {
                                alert('Nie udało się zeskanować kodu: ' + err);
                            }
                        });
                }
            };
        })();
        
        debugConsole('Plugins:', Capacitor.Plugins);
    </script>
